name: Deploy Static Files

on:
  push:
    branches: [main]
    paths:
      - 'review.html'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A plain copy: the page holds no credential and needs nothing substituted.
      - name: Stage static files
        run: |
          mkdir -p output
          cp review.html output/review.html

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true

name: Deploy Static Files

on:
  push:
    branches: [main]
    paths:
      - 'review.html'
      - 'webapp/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A plain copy: the page holds no credential and needs nothing substituted.
      - name: Stage static files
        run: |
          mkdir -p output
          cp review.html output/review.html
          # Web app shell: manifest, service worker (must sit beside review.html for scope), icons.
          cp -r webapp/. output/

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
